<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --accent:#C8A96A;          /* يُضبط من ملف الإعدادات أسفل */
  --accent-tx:#101010;
  --bg:#0E0E0F; --surface:#17181A; --surface2:#202124;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --tx:#F5F3EF; --tx2:rgba(245,243,239,.62);
  --wa:#3DDC7F; --fb:#5E9FE8; --ig:#E27BB5; --tt:#EDEDED;
  --serif:Georgia,"Times New Roman","Noto Naskh Arabic","Amiri",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",Helvetica,Arial,sans-serif;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(100px + env(safe-area-inset-bottom))}
img{max-width:100%}
.wrap{max-width:520px;margin:0 auto}

/* ---- الشريط العلوي ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;background:rgba(14,14,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.mark{font:600 15px/1.2 var(--serif);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;gap:6px;flex:0 0 auto}
.langs button{min-width:44px;height:36px;padding:0 8px;border:1px solid var(--line2);background:transparent;color:var(--tx2);
  border-radius:9px;font:600 13px/1 var(--sans);cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(200,169,106,.12)}

/* ---- الواجهة ---- */
.hero{position:relative;overflow:hidden;padding:36px 22px 32px;text-align:center;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.24}
.hero-sc{position:absolute;inset:0;background:
  radial-gradient(120% 85% at 50% 0%,rgba(200,169,106,.18),transparent 62%),
  linear-gradient(180deg,rgba(14,14,15,.45),rgba(14,14,15,.92))}
.hero-in{position:relative;z-index:2}
.logo{width:108px;height:108px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;
  border:1px solid var(--accent);padding:4px;background:var(--bg)}
.logo.mono{display:flex;align-items:center;justify-content:center;font:400 42px/1 var(--serif);color:var(--accent)}
h1{margin:0;font:400 30px/1.25 var(--serif)}
.role{margin:11px 0 0;font-size:12px;font-weight:700;color:var(--accent)}
html[dir="ltr"] .role{text-transform:uppercase;letter-spacing:.16em}
.rule{width:54px;height:1px;background:var(--accent);opacity:.55;margin:16px auto}
.tag{margin:0;color:var(--tx2);font-size:14.5px}

/* ---- أيقونات التواصل ---- */
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:20px 18px 0}
.socials a{width:54px;height:54px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);
  display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .12s ease}
.socials a:active{transform:scale(.95)}
.socials svg{width:22px;height:22px}

/* ---- الأقسام ---- */
section{padding:28px 18px 0}
.sh{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.sh span{font:700 11.5px/1 var(--sans);color:var(--accent)}
html[dir="ltr"] .sh span{text-transform:uppercase;letter-spacing:.18em}
.sh i{flex:1;height:1px;background:var(--line)}
p.about{margin:0;color:var(--tx2);font-size:15.5px}

/* ---- قائمة الأسعار (ستايل مينو) ---- */
.menu{list-style:none;margin:0;padding:0}
.menu li{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.menu li:last-child{border-bottom:0}
.menu .nm{font-weight:500;font-size:15.5px}
.menu .dots{flex:1;min-width:18px;border-bottom:1px dotted var(--line2);transform:translateY(-5px)}
.menu .pr{color:var(--accent);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- معرض أفقي ---- */
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:2px 18px 8px;margin:0 -18px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal button{flex:0 0 68%;aspect-ratio:4/5;border:0;padding:0;margin:0;border-radius:16px;overflow:hidden;
  background:var(--surface2);scroll-snap-align:center;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- صفوف ---- */
.rows{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:58px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row .ic{width:20px;height:20px;flex:0 0 20px;color:var(--accent)}
.row .tx{flex:1;min-width:0;font-size:15px}
.row .tx small{display:block;color:var(--tx2);font-size:12.5px;font-weight:400}
.row .val{color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14.5px}
.row .ch{width:15px;height:15px;flex:0 0 15px;color:var(--tx2)}
html[dir="rtl"] .row .ch{transform:scaleX(-1)}
.note{margin:10px 2px 0;color:var(--tx2);font-size:13px}
/* الأرقام والأوقات تبقى من اليسار لليمين داخل النص العربي */
.num{direction:ltr;unicode-bidi:isolate}

/* ---- بطاقة التقييم ---- */
.review{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;text-decoration:none;color:inherit;
  border:1px solid var(--accent);border-radius:16px;background:rgba(200,169,106,.08);text-align:center}
.review .stars{display:flex;gap:4px}
.review .stars svg{width:19px;height:19px;color:var(--accent)}
.review b{font-size:15.5px;font-weight:600}
.review small{color:var(--tx2);font-size:13px}

/* ---- الشريط السفلي الثابت ---- */
.bar{position:fixed;inset-inline:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;display:flex;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(14,14,15,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar a,.bar button{flex:1;min-height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  font:600 15.5px/1 var(--sans);text-decoration:none;cursor:pointer;border:1px solid var(--line2);
  background:transparent;color:var(--tx);padding:0 10px}
.bar .primary{background:var(--accent);color:var(--accent-tx);border-color:var(--accent)}
.bar .sq{flex:0 0 54px;min-width:54px;padding:0}
.bar svg{width:20px;height:20px}

footer{padding:28px 18px 4px;text-align:center;color:var(--tx2);font-size:12.5px}
footer a{color:var(--tx);text-decoration:none;border-bottom:1px solid var(--accent);font-weight:600}

/* ---- المعاينة الكبيرة ---- */
.lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.94)}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:14px}
.lb .x{position:absolute;top:14px;inset-inline-end:14px;width:46px;height:46px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line2);background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1}
#toast{position:fixed;bottom:calc(110px + env(safe-area-inset-bottom));inset-inline:0;margin:0 auto;width:max-content;max-width:80%;
  background:var(--surface2);color:var(--tx);border:1px solid var(--line2);padding:11px 18px;border-radius:999px;font-size:14px;
  opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:70}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 7 9 6 9-6"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.6 12h18.8M12 2.5c2.5 2.6 3.8 6 3.8 9.5S14.5 18.9 12 21.5c-2.5-2.6-3.8-6-3.8-9.5S9.5 5.1 12 2.5Z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5.3l3.4 2"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9L12 2.6Z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 20v-1.8a3.6 3.6 0 00-3.6-3.6H6.6A3.6 3.6 0 003 18.2V20"/><circle cx="9.2" cy="7.4" r="3.6"/><path d="M19 8v5m2.5-2.5h-5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5V3m0 0L7.8 7.2M12 3l4.2 4.2"/><path d="M4.5 13.5v5A2.5 2.5 0 007 21h10a2.5 2.5 0 002.5-2.5v-5"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M10.5 13.5a4 4 0 005.7 0l3-3a4 4 0 10-5.7-5.7l-1 1"/><path d="M13.5 10.5a4 4 0 00-5.7 0l-3 3a4 4 0 105.7 5.7l1-1"/></svg>',
  ch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>'
};

var lang = pickLang();

function pickLang(){
  var q = (location.search.match(/[?&]lang=(ar|fr|en)/i) || [])[1];   // رابط مباشر بلغة: …/?lang=fr
  if(q) return q.toLowerCase();
  try{ var s = localStorage.getItem("nfc4all-lang"); if(s && UI[s]) return s; }catch(e){}
  if(C.autoDetectLang !== false){
    var n = (navigator.language || "").slice(0,2).toLowerCase();
    if(UI[n]) return n;
  }
  return UI[C.defaultLang] ? C.defaultLang : "ar";
}
function t(v){ if(!v) return ""; return typeof v === "string" ? v : (v[lang] || v.ar || v.fr || v.en || ""); }
function e(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function digits(p){ return String(p || "").replace(/[^0-9]/g,""); }

function row(href, icon, label, value, ext, num){
  var tag = href ? "a" : "div", at = href ? ' href="' + e(href) + '"' + (ext ? ' target="_blank" rel="noopener"' : "") : "",
      nc = num ? " num" : "";
  return "<" + tag + ' class="row"' + at + '><span class="ic">' + icon + '</span><span class="tx">' + e(label) +
    (value && href ? '<small class="' + (num ? "num" : "") + '">' + e(value) + "</small>" : "") + "</span>" +
    (value && !href ? '<span class="val' + nc + '">' + e(value) + "</span>" : "") +
    (href ? '<span class="ch">' + I.ch + "</span>" : "") + "</" + tag + ">";
}
function head(txt){ return '<div class="sh"><span>' + e(txt) + '</span><i></i></div>'; }

function render(){
  var L = UI[lang], waHref = "", i;
  document.documentElement.lang = lang;
  document.documentElement.dir  = (lang === "ar") ? "rtl" : "ltr";
  document.getElementById("mark").textContent = t(C.name);

  if(C.whatsapp) waHref = "https://wa.me/" + digits(C.whatsapp) + (t(C.whatsappMsg) ? "?text=" + encodeURIComponent(t(C.whatsappMsg)) : "");

  /* --- اللغات --- */
  var lg = "";
  for(i = 0; i < LANGS.length; i++){
    lg += '<button type="button" data-l="' + LANGS[i] + '" aria-pressed="' + (LANGS[i] === lang) + '" lang="' + LANGS[i] + '">' + LAB[LANGS[i]] + "</button>";
  }
  document.getElementById("langs").innerHTML = lg;

  /* --- الواجهة --- */
  var h = '<div class="hero">' +
    (C.hero ? '<div class="hero-bg" style="background-image:url(' + e(C.hero) + ')"></div>' : "") +
    '<div class="hero-sc"></div><div class="hero-in">' +
    (C.logo ? '<img class="logo" src="' + e(C.logo) + '" alt="' + e(t(C.name)) + '">'
            : '<div class="logo mono">' + e(t(C.name).charAt(0)) + "</div>") +
    "<h1>" + e(t(C.name)) + "</h1>" +
    (t(C.role) ? '<p class="role">' + e(t(C.role)) + "</p>" : "") +
    '<div class="rule"></div>' +
    (t(C.tagline) ? '<p class="tag">' + e(t(C.tagline)) + "</p>" : "") +
    "</div></div>";

  /* --- أيقونات التواصل --- */
  var soc = [
    [waHref,      I.wa,    L.wa,    "var(--wa)"],
    [C.facebook,  I.fb,    L.fb,    "var(--fb)"],
    [C.instagram, I.ig,    L.ig,    "var(--ig)"],
    [C.tiktok,    I.tt,    L.tt,    "var(--tt)"],
    [C.maps,      I.pin,   L.dir,   "var(--accent)"],
    [C.website,   I.globe, L.web,   "var(--accent)"]
  ], sc = "";
  for(i = 0; i < soc.length; i++){
    if(!soc[i][0]) continue;
    sc += '<a href="' + e(soc[i][0]) + '" target="_blank" rel="noopener" aria-label="' + e(soc[i][2]) +
          '" title="' + e(soc[i][2]) + '" style="color:' + soc[i][3] + '">' + soc[i][1] + "</a>";
  }
  if(sc) h += '<div class="socials">' + sc + "</div>";

  /* --- نبذة --- */
  if(t(C.about)) h += "<section>" + head(L.about) + '<p class="about">' + e(t(C.about)) + "</p></section>";

  /* --- القائمة والأسعار --- */
  if(C.services && C.services.length){
    var mn = "";
    for(i = 0; i < C.services.length; i++){
      mn += '<li><span class="nm">' + e(t(C.services[i].name)) + '</span><span class="dots"></span>' +
            '<span class="pr num">' + e(C.services[i].price) + "</span></li>";
    }
    h += "<section>" + head(L.menu) + '<ul class="menu">' + mn + "</ul></section>";
  }

  /* --- المعرض --- */
  if(C.gallery && C.gallery.length){
    var g = "";
    for(i = 0; i < C.gallery.length; i++){
      g += '<button type="button" data-img="' + e(C.gallery[i]) + '"><img src="' + e(C.gallery[i]) +
           '" alt="" loading="lazy"></button>';
    }
    h += "<section>" + head(L.work) + '<div class="gal">' + g + "</div></section>";
  }

  /* --- أوقات العمل --- */
  if(C.hours && C.hours.length){
    var hr = "";
    for(i = 0; i < C.hours.length; i++){
      hr += row("", I.clock, t(C.hours[i].days), C.hours[i].time, false, true);
    }
    h += "<section>" + head(L.hours) + '<div class="rows">' + hr + "</div>" +
         (t(C.hoursNote) ? '<p class="note">' + e(t(C.hoursNote)) + "</p>" : "") + "</section>";
  }

  /* --- الاتصال والموقع --- */
  var cr = "";
  if(C.phone)      cr += row("tel:" + C.phone, I.phone, L.phone, C.phone, false, true);
  if(C.maps)       cr += row(C.maps, I.pin, L.dir, t(C.address), true);
  else if(t(C.address)) cr += row("", I.pin, L.addr, t(C.address), false);
  if(C.email)      cr += row("mailto:" + C.email, I.mail, L.mail, C.email, false, true);
  if(C.website)    cr += row(C.website, I.globe, L.web, C.website.replace(/^https?:\/\//,""), true, true);
  if(cr) h += "<section>" + head(L.contact) + '<div class="rows">' + cr + "</div></section>";

  /* --- روابط إضافية --- */
  if(C.extraLinks && C.extraLinks.length){
    var xl = "";
    for(i = 0; i < C.extraLinks.length; i++){
      if(!C.extraLinks[i].url) continue;
      xl += row(C.extraLinks[i].url, I.link, t(C.extraLinks[i].label), "", true);
    }
    if(xl) h += "<section>" + head(L.links) + '<div class="rows">' + xl + "</div></section>";
  }

  /* --- التقييم --- */
  if(C.review){
    h += '<section><a class="review" href="' + e(C.review) + '" target="_blank" rel="noopener">' +
         '<span class="stars">' + I.star + I.star + I.star + I.star + I.star + "</span>" +
         "<b>" + e(L.reviewT) + "</b><small>" + e(L.reviewS) + "</small></a></section>";
  }

  /* --- التوقيع --- */
  h += "<footer>" + e(L.by) + " " +
       (C.brand && C.brand.url
         ? '<a href="' + e(C.brand.url) + '" target="_blank" rel="noopener">' + e(C.brand.name) + "</a>"
         : "<b>" + e(C.brand ? C.brand.name : "") + "</b>") + "</footer>";

  document.getElementById("app").innerHTML = h;

  /* --- الشريط السفلي الثابت --- */
  var b = '<button type="button" class="primary" id="vcf">' + I.user + "<span>" + e(L.save) + "</span></button>";
  if(waHref) b += '<a href="' + e(waHref) + '" target="_blank" rel="noopener" style="color:var(--wa)">' + I.wa + "</a>";
  else if(C.phone) b += '<a href="tel:' + e(C.phone) + '">' + I.phone + "<span>" + e(L.call) + "</span></a>";
  b += '<button type="button" class="sq" id="shr" aria-label="' + e(L.share) + '" title="' + e(L.share) + '">' + I.share + "</button>";
  document.getElementById("bar").innerHTML = b;

  document.getElementById("vcf").onclick = saveContact;
  document.getElementById("shr").onclick = shareCard;
}

/* ---- ملف جهة الاتصال ---- */
function vcard(){
  var v = C.vcard || {}, nm = t(C.name),
      full = (v.firstName ? ((v.firstName + " " + (v.lastName || "")).trim()) : nm),
      out = ["BEGIN:VCARD", "VERSION:3.0",
             "N:" + (v.lastName || "") + ";" + (v.firstName || nm) + ";;;",
             "FN:" + full];
  if(v.org)   out.push("ORG:" + v.org);
  if(v.title) out.push("TITLE:" + v.title);
  if(C.phone) out.push("TEL;TYPE=CELL:" + C.phone);
  if(C.whatsapp && digits(C.whatsapp) !== digits(C.phone)) out.push("TEL;TYPE=WORK:" + C.whatsapp);
  if(C.email) out.push("EMAIL;TYPE=INTERNET:" + C.email);
  if(t(C.address)) out.push("ADR;TYPE=WORK:;;" + t(C.address).replace(/,/g, "\\,") + ";;;;");
  out.push("URL:" + (C.website || location.href));
  if(t(C.role)) out.push("NOTE:" + t(C.role));
  out.push("END:VCARD");
  return out.join("\r\n");
}
function saveContact(){
  try{
    var blob = new Blob([vcard()], { type:"text/vcard;charset=utf-8" }),
        url  = URL.createObjectURL(blob),
        a    = document.createElement("a");
    a.href = url; a.download = ((C.vcard && C.vcard.fileName) || "contact") + ".vcf";
    document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(err){ if(C.phone) location.href = "tel:" + C.phone; }
}

/* ---- مشاركة ---- */
function shareCard(){
  var data = { title:t(C.name), text:t(C.role), url:location.href };
  if(navigator.share){ navigator.share(data).catch(function(){}); return; }
  var done = function(){ toast(UI[lang].copied); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done, done);
  else done();
}
var tmr;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(tmr); tmr = setTimeout(function(){ el.classList.remove("on"); }, 2200);
}

/* ---- المعاينة الكبيرة ---- */
var lb = document.getElementById("lb"), lbi = document.getElementById("lbi");
function closeLb(){ lb.classList.remove("on"); lbi.removeAttribute("src"); }
document.getElementById("lbx").onclick = closeLb;
lb.addEventListener("click", function(ev){ if(ev.target === lb) closeLb(); });
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeLb(); });

/* ---- الأحداث ---- */
document.addEventListener("click", function(ev){
  var g = ev.target.closest ? ev.target.closest("[data-img]") : null;
  if(g){ lbi.src = g.getAttribute("data-img"); lb.classList.add("on"); return; }
  var b = ev.target.closest ? ev.target.closest("[data-l]") : null;
  if(b){
    lang = b.getAttribute("data-l");
    try{ localStorage.setItem("nfc4all-lang", lang); }catch(err){}
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
  }
});

/* ---- الإقلاع ---- */
if(C.accent)     document.documentElement.style.setProperty("--accent", C.accent);
if(C.accentText) document.documentElement.style.setProperty("--accent-tx", C.accentText);
render();
})();
</script>
</body>
</html>
