*{box-sizing:border-box}
:root{
  --g1:#8B5CF6; --g2:#5B21B6; --g3:#120C24;
  --tx:#FFFFFF; --tx2:rgba(255,255,255,.74);
  --glass:rgba(255,255,255,.11); --stroke:rgba(255,255,255,.20);
  --wa:#25D366; --fb:#4C8DF6; --tt:#0F0F12; --gold:#FBBF24;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Helvetica Neue",Arial,sans-serif;
}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--tx);background:#120C24;min-height:100vh;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(165deg,var(--g1) 0%,var(--g2) 44%,var(--g3) 100%)}
#bg::before{content:"";position:absolute;inset:0;background-image:var(--bgimg,none);background-size:cover;background-position:center;opacity:.26}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.20),transparent 62%)}
.wrap{max-width:440px;margin:0 auto;padding:18px 16px calc(38px + env(safe-area-inset-bottom))}

.lang{display:flex;justify-content:center;margin-bottom:16px}
.lang .grp{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lang button{border:0;background:transparent;color:var(--tx2);font:inherit;font-weight:800;font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#4C1D95}

.hero{text-align:center;padding:6px 4px 2px}
.av{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.6);box-shadow:0 16px 34px rgba(0,0,0,.42)}
h1{margin:14px 0 5px;font-size:26px;font-weight:800;letter-spacing:-.2px;line-height:1.25}
.role{margin:0;font-size:15px;font-weight:700}
.city{margin:7px 0 0;font-size:13.5px;color:var(--tx2)}
.bio{margin:14px auto 0;max-width:360px;font-size:14.5px;line-height:1.75;color:var(--tx2)}

.cta{display:grid;gap:10px;margin:20px 0 20px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:16px;border:0;font:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}
.btn svg{width:19px;height:19px}
.btn.p{background:#fff;color:#4C1D95;box-shadow:0 12px 26px rgba(0,0,0,.30)}
.btn.s{background:var(--glass);color:#fff;border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.links{display:grid;gap:10px}
.lnk{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;text-decoration:none}
.lnk .ic{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15)}
.lnk .ic svg{width:20px;height:20px}
.lnk.call .ic{background:#fff;color:#5B21B6}
.lnk.wa .ic{background:var(--wa);color:#06301A}
.lnk.fb .ic{background:var(--fb);color:#fff}
.lnk.ig .ic{background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
.lnk.tt .ic{background:var(--tt);color:#fff}
.lnk .tx{flex:1;min-width:0}
.lnk .l1{display:block;font-size:15.5px;font-weight:800;line-height:1.35}
.lnk .l2{display:block;font-size:12.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk .ch{flex:0 0 auto;color:rgba(255,255,255,.5)}
.lnk .ch svg{width:18px;height:18px}
[dir="rtl"] .lnk .ch svg{transform:scaleX(-1)}

.sec{margin-top:22px}
.ttl{margin:0 0 12px;font-size:12.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.72);text-align:center}
.acc{margin-bottom:10px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:11px;padding:14px 14px;background:transparent;border:0;color:#fff;font:inherit;font-size:15.5px;font-weight:800;text-align:start;cursor:pointer}
.acc .ic{flex:0 0 34px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.acc .ic svg{width:18px;height:18px}
.acc .pm{margin-inline-start:auto;display:flex;color:rgba(255,255,255,.65);transition:transform .18s ease}
.acc .pm svg{width:18px;height:18px}
.acc>button[aria-expanded="true"] .pm{transform:rotate(180deg)}
.acc .bd{padding:0 15px 14px}
.srv{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.13)}
.srv .nm{flex:1;font-size:14.5px;font-weight:700;line-height:1.4}
.srv .pr{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.17);border:1px solid var(--stroke);white-space:nowrap}
.hr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.13)}
.hr .d{flex:1;font-size:14.5px;font-weight:700}
.hr .tm{font-size:14px;font-weight:700;color:var(--tx2)}
.note{margin:11px 0 0;font-size:12.5px;color:var(--tx2)}

.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g a{display:block;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:rgba(255,255,255,.08)}
.g a:first-child{grid-column:span 2;grid-row:span 2;border-radius:16px}
.g img{width:100%;height:100%;object-fit:cover;display:block}

.rev{margin-top:22px;padding:22px 18px;text-align:center;border-radius:22px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rev .st{display:flex;justify-content:center;gap:4px;color:var(--gold);margin-bottom:10px}
.rev .st svg{width:19px;height:19px}
.rev h3{margin:0 0 5px;font-size:17px;font-weight:800}
.rev p{margin:0 0 15px;font-size:13.5px;color:var(--tx2)}

.foot{margin-top:26px;text-align:center;font-size:12.5px;color:rgba(255,255,255,.55)}
.foot a{color:rgba(255,255,255,.85);font-weight:800;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
.num{direction:ltr;unicode-bidi:isolate}

.lb{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(9,5,20,.93)}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:88vh;border-radius:14px}
.lbx{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer}
.toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:70;display:flex;justify-content:center;opacity:0;transition:opacity .2s ease;pointer-events:none}
.toast.on{opacity:1}
.toast span{background:#fff;color:#2B0F5B;font-size:14px;font-weight:800;padding:11px 18px;border-radius:999px;box-shadow:0 12px 26px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  if (CARD.role) h += '<p class="role">' + e(t(CARD.role)) + '</p>';
  if (CARD.city) h += '<p class="city">' + e(t(CARD.city)) + '</p>';
  if (CARD.bio) h += '<p class="bio">' + e(t(CARD.bio)) + '</p>';
  h += '</header>';

  h += '<div class="cta">' +
    '<button class="btn p" type="button" id="save">' + I.user + '<span>' + e(u.save) + '</span></button>' +
    '<button class="btn s" type="button" id="share">' + I.share + '<span>' + e(u.share) + '</span></button>' +
    '</div>';

  const links = [];
  if (CARD.phone) links.push({ cls:"call", icon:I.call, l1:u.call, l2:CARD.phone, href:"tel:" + CARD.phone.replace(/\s/g, "") });
  if (CARD.whatsapp) links.push({ cls:"wa", icon:I.wa, l1:u.wa, l2:u.waSub, href:"https://wa.me/" + digits(CARD.whatsapp), ext:true });
  if (CARD.facebook) links.push({ cls:"fb", icon:I.fb, l1:u.fb, l2:u.fbSub, href:CARD.facebook, ext:true });
  if (CARD.instagram) links.push({ cls:"ig", icon:I.ig, l1:u.ig, l2:u.igSub, href:CARD.instagram, ext:true });
  if (CARD.tiktok) links.push({ cls:"tt", icon:I.tt, l1:u.tt, l2:u.ttSub, href:CARD.tiktok, ext:true });
  if (CARD.website) links.push({ cls:"web", icon:I.globe, l1:u.web, l2:CARD.website.replace(/^https?:\/\//, ""), href:CARD.website, ext:true });
  if (CARD.maps) links.push({ cls:"pin", icon:I.pin, l1:u.dir, l2:t(CARD.address), href:CARD.maps, ext:true });
  if (CARD.email) links.push({ cls:"mail", icon:I.mail, l1:u.mail, l2:CARD.email, href:"mailto:" + CARD.email });
  (CARD.extraLinks || []).forEach(function(x){
    if (x && x.url) links.push({ cls:"web", icon:I.globe, l1:t(x.label), l2:"", href:x.url, ext:true });
  });
  if (links.length) h += '<nav class="links">' + links.map(lnk).join("") + '</nav>';

  let accs = "";
  if (CARD.services && CARD.services.length) {
    accs += acc("srv", I.tag, u.services, CARD.services.map(function(s){
      const p = t(s.price);
      return '<div class="srv"><span class="nm">' + e(t(s.name)) + '</span>' + (p ? '<span class="pr' + nc(p) + '">' + e(p) + '</span>' : "") + '</div>';
    }).join(""), true);
  }
  if (CARD.hours && CARD.hours.length) {
    accs += acc("hrs", I.clock, u.hours, CARD.hours.map(function(x){
      const tm = t(x.time);
      return '<div class="hr"><span class="d">' + e(t(x.days)) + '</span><span class="tm' + nc(tm) + '">' + e(tm) + '</span></div>';
    }).join("") + (CARD.hoursNote ? '<p class="note">' + e(t(CARD.hoursNote)) + '</p>' : ""), false);
  }
  if (accs) h += '<section class="sec">' + accs + '</section>';

  if (CARD.gallery && CARD.gallery.length) {
    h += '<section class="sec"><h2 class="ttl">' + e(u.work) + '</h2><div class="g">' + CARD.gallery.map(function(src){
      return '<a href="#" data-img="' + e(src) + '"><img src="' + e(src) + '" alt="" loading="lazy"></a>';
    }).join("") + '</div></section>';
  }

  if (CARD.review) {
    h += '<section class="rev"><div class="st">' + I.star + I.star + I.star + I.star + I.star + '</div>' +
      '<h3>' + e(u.review) + '</h3><p>' + e(u.reviewSub) + '</p>' +
      '<a class="btn p" href="' + e(CARD.review) + '" target="_blank" rel="noopener">' + I.star + '<span>' + e(u.reviewBtn) + '</span></a></section>';
  }

  const b = CARD.brand || {};
  h += '<p class="foot">' + e(u.by) + ' ' + (b.url ? '<a href="' + e(b.url) + '" target="_blank" rel="noopener">' + e(b.name) + '</a>' : e(b.name || "")) + '</p>';

  app.innerHTML = h;
  wire();
}

function wire(){
  document.querySelectorAll("[data-lang]").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.getAttribute("data-lang");
      try { localStorage.setItem("nfc4all-lang", lang); } catch (err) {}
      render();
    });
  });
  document.querySelectorAll("[data-acc]").forEach(function(b){
    b.addEventListener("click", function(){
      const bd = document.getElementById("acc-" + b.getAttribute("data-acc"));
      const open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", String(!open));
      if (bd) bd.hidden = open;
    });
  });
  document.querySelectorAll("[data-img]").forEach(function(a){
    a.addEventListener("click", function(ev){ ev.preventDefault(); openLb(a.getAttribute("data-img")); });
  });
  const s = document.getElementById("save");
  if (s) s.addEventListener("click", saveContact);
  const sh = document.getElementById("share");
  if (sh) sh.addEventListener("click", shareCard);
}

function vcard(){
  const v = CARD.vcard || {};
  const full = t(CARD.name);
  const first = v.firstName || full;
  const last = v.lastName || "";
  const out = ["BEGIN:VCARD", "VERSION:3.0", "N:" + last + ";" + first + ";;;", "FN:" + (last ? first + " " + last : full)];
  if (v.org) out.push("ORG:" + v.org);
  if (v.title) out.push("TITLE:" + v.title);
  if (CARD.phone) out.push("TEL;TYPE=CELL:" + CARD.phone);
  if (CARD.whatsapp && CARD.whatsapp !== CARD.phone) out.push("TEL;TYPE=WORK:" + CARD.whatsapp);
  if (CARD.email) out.push("EMAIL:" + CARD.email);
  if (CARD.website) out.push("URL:" + CARD.website);
  if (CARD.address) out.push("ADR;TYPE=WORK:;;" + t(CARD.address) + ";;;;");
  if (CARD.facebook) out.push("X-SOCIALPROFILE;TYPE=facebook:" + CARD.facebook);
  if (CARD.instagram) out.push("X-SOCIALPROFILE;TYPE=instagram:" + CARD.instagram);
  if (CARD.tiktok) out.push("X-SOCIALPROFILE;TYPE=tiktok:" + CARD.tiktok);
  out.push("URL;TYPE=card:" + location.href.split("?")[0]);
  out.push("END:VCARD");
  return out.join("\r\n");
}

function saveContact(){
  const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ((CARD.vcard && CARD.vcard.fileName) || "contact") + ".vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast(UI[lang].saved);
}

async function shareCard(){
  const url = location.href;
  if (navigator.share) {
    try { await navigator.share({ title: t(CARD.name), text: t(CARD.role), url: url }); return; }
    catch (err) { if (err && err.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast(UI[lang].copied); }
  catch (err) { toast(url); }
}

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2200);
}

const lb = document.getElementById("lb");
const lbi = document.getElementById("lbi");
function openLb(src){ lbi.src = src; lb.hidden = false; }
function closeLb(){ lb.hidden = true; lbi.src = ""; }
document.getElementById("lbx").addEventListener("click", closeLb);
lb.addEventListener("click", function(ev){ if (ev.target === lb) closeLb(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && !lb.hidden) closeLb(); });

render();
</script>
</body>
</html>
