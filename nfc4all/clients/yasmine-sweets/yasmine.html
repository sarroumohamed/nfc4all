<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#831843">
<meta name="color-scheme" content="light">
<title id="ttl">Patisserie</title>
<style>
:root{--ink:#231A1D;--ink2:#7A6B70;--canvas:#F6F1F0;--surface:#FFFFFF;--stroke:#EADFE1;--accent:#BE185D;--accent2:#831843;--gold:#D9B471;--wa:#16A34A;--fb:#2563EB;--ig:#DD2A7B;--tt:#141414;--star:#F59E0B;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic","Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman","Noto Sans Arabic",serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px}
.lg{width:44px;height:33px;border-radius:10px;border:1px solid var(--stroke);background:var(--surface);color:var(--ink2);font:700 13px/1 var(--sans);cursor:pointer}
.lg.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}

/* flip business card */
.cardwrap{perspective:1200px}
.flip{position:relative;width:100%;aspect-ratio:1.72/1;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;padding:15px 16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 38px -22px rgba(35,26,29,.7)}
.front{background:linear-gradient(135deg,#9F1239 0%,var(--accent2) 58%,#4C0519 100%);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.front::after{content:"";position:absolute;inset-inline-end:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(217,180,113,.35),transparent 68%)}
.fh{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.mk{width:52px;height:52px;border-radius:13px;object-fit:cover;border:1.5px solid rgba(217,180,113,.85);flex:0 0 auto}
.fh h1{margin:0;font-family:var(--serif);font-size:19px;line-height:1.2}
.fh p{margin:3px 0 0;font-size:11.5px;color:rgba(255,255,255,.8);line-height:1.35}
.gl{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(217,180,113,0));margin:10px 0;position:relative;z-index:2}
.fb2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative;z-index:2}
.fb2 .ph{font-size:14px;font-weight:800}
.fb2 .ct{font-size:11.5px;color:rgba(255,255,255,.78);text-align:end}
.back{background:var(--surface);border:1px solid var(--stroke);transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:space-between}
.bt{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.bl{list-style:none;margin:8px 0 0;padding:0}
.bl li{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}
.bl svg{width:14px;height:14px;color:var(--accent);flex:0 0 auto}
.bs{display:flex;gap:8px;margin-top:8px}
.bs a{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff}
.bs svg{width:15px;height:15px}
.bs .fb{background:var(--fb)}
.bs .ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)}
.bs .tt{background:var(--tt)}
.hint{margin:12px auto 0;background:none;border:none;color:var(--ink2);font:600 12px/1 var(--sans);cursor:pointer;display:flex;align-items:center;gap:6px}
.hint svg{width:13px;height:13px}

/* CTA + chips */
.cta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.b{display:flex;align-items:center;justify-content:center;gap:7px;height:50px;border-radius:14px;border:1px solid transparent;font:800 14px/1 var(--sans);cursor:pointer;text-decoration:none}
.b svg{width:17px;height:17px;flex:0 0 auto}
.b.p{background:var(--accent2);color:#fff}
.b.s{background:var(--surface);color:var(--ink);border-color:var(--stroke)}
.b.w{background:var(--wa);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--stroke);text-decoration:none;color:var(--ink);font:700 12.5px/1 var(--sans);cursor:pointer}
.chip svg{width:15px;height:15px;flex:0 0 auto}
.chip.fb svg{color:var(--fb)}
.chip.ig svg{color:var(--ig)}
.chip.tt svg{color:var(--tt)}
.chip.web svg{color:var(--accent)}
.chip.mail svg{color:#0EA5E9}

/* sections */
.sec{margin-top:26px}
.sh{margin:0 0 12px}
.sh h2{margin:0;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink2)}
.sh i{display:block;width:26px;height:3px;border-radius:3px;background:var(--gold);margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--stroke);border-radius:18px;padding:13px 14px}

/* menu rows with photos */
.mr{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--stroke);text-decoration:none;color:inherit}
.mr:first-child{border-top:none}
.mr img{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:0 0 auto;background:var(--canvas)}
.mb{flex:1;min-width:0;display:block}
.mn{display:block;font-size:14.5px;font-weight:700}
.md{display:block;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.45}
.mp{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap}

/* wide stacked gallery */
.wide{display:flex;flex-direction:column;gap:10px}
.wi{position:relative;display:block;border-radius:18px;overflow:hidden}
.wi img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.wi::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,10,14,.55),transparent 58%)}
.wi span{position:absolute;inset-inline-start:14px;bottom:11px;z-index:2;color:#fff;font-size:12.5px;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.55)}

/* hours + location + review */
.hrsg{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;align-items:baseline}
.hrsg .d{color:var(--ink2)}
.hrsg .v{font-weight:800;text-align:end}
.note{margin:10px 0 0;font-size:11.5px;color:var(--ink2);line-height:1.5}
.loc{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.loc .ic{width:42px;height:42px;border-radius:13px;background:#FCE7F0;color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.loc .ic svg{width:19px;height:19px}
.loc .lt{display:block;font-size:13.5px;font-weight:800}
.loc .lv{display:block;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.45}
.rev{margin-top:26px;text-align:center;background:var(--surface);border:1px solid var(--stroke);border-radius:18px;padding:16px 14px}
.stars{display:flex;justify-content:center;gap:3px;color:var(--star);margin-bottom:8px}
.stars svg{width:17px;height:17px}
.rev h3{margin:0;font-family:var(--serif);font-size:16px}
.rev p{margin:5px 0 13px;font-size:12.5px;color:var(--ink2)}
.foot{margin:20px 0 0;text-align:center;font-size:12px;color:var(--ink2)}
.foot a{color:var(--ink);font-weight:800;text-decoration:none;border-bottom:1px solid var(--stroke)}
.num{direction:ltr;unicode-bidi:isolate}

/* lightbox + toast */
.lb{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(24,12,16,.93)}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:88vh;border-radius:16px}
.lbx{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
.toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom));z-index:70;display:flex;justify-content:center;opacity:0;transition:opacity .2s ease;pointer-events:none}
.toast.on{opacity:1}
.toast span{background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<div class="lb" id="lb" hidden>
  <button class="lbx" id="lbx" aria-label="close">✕</button>
  <img id="lbi" alt="">
</div>
<div class="toast" id="toast"><span id="toastMsg"></span></div>

  const bs = [];
  if (c.facebook)  bs.push('<a class="fb" target="_blank" rel="noopener" href="' + e(c.facebook) + '" aria-label="Facebook">' + I.fb + '</a>');
  if (c.instagram) bs.push('<a class="ig" target="_blank" rel="noopener" href="' + e(c.instagram) + '" aria-label="Instagram">' + I.ig + '</a>');
  if (c.tiktok)    bs.push('<a class="tt" target="_blank" rel="noopener" href="' + e(c.tiktok) + '" aria-label="TikTok">' + I.tt + '</a>');

  p.push('<div class="cardwrap">' +
    '<div class="flip' + (PARAMS.get("flip") === "1" ? ' on' : '') + '" id="flip" role="button" tabindex="0">' +
      '<div class="face front">' +
        '<div>' +
          '<div class="fh">' +
            (c.logo ? '<img class="mk" src="' + e(c.logo) + '" alt="">' : '') +
            '<div><h1>' + e(t(c.name)) + '</h1>' + (c.role ? '<p>' + e(t(c.role)) + '</p>' : '') + '</div>' +
          '</div>' +
          '<div class="gl"></div>' +
        '</div>' +
        '<div class="fb2">' +
          (c.phone ? '<span class="ph num">' + e(c.phone) + '</span>' : '<span></span>') +
          (c.city ? '<span class="ct">' + e(t(c.city)) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="face back">' +
        (c.bio ? '<p class="bt">' + e(t(c.bio)) + '</p>' : '') +
        (bl.length ? '<ul class="bl">' + bl.join("") + '</ul>' : '') +
        (bs.length ? '<div class="bs">' + bs.join("") + '</div>' : '') +
      '</div>' +
    '</div>' +
  '</div>');
  p.push('<button class="hint" id="hint">' + I.flip + '<span>' + u.flip + '</span></button>');

  /* 2 · CTA */
  p.push('<div class="cta">' +
    '<button class="b p" id="save">' + I.user + '<span>' + u.save + '</span></button>' +
    (c.whatsapp
      ? '<a class="b w" target="_blank" rel="noopener" href="https://wa.me/' + digits(c.whatsapp) + '">' + I.wa + '<span>' + u.wa + '</span></a>'
      : '<button class="b s" id="share2">' + I.share + '<span>' + u.share + '</span></button>') +
  '</div>');

  /* 3 · chips */
  const ch = [];
  if (c.facebook)  ch.push('<a class="chip fb" target="_blank" rel="noopener" href="' + e(c.facebook) + '">' + I.fb + '<span>' + u.facebook + '</span></a>');
  if (c.instagram) ch.push('<a class="chip ig" target="_blank" rel="noopener" href="' + e(c.instagram) + '">' + I.ig + '<span>' + u.instagram + '</span></a>');
  if (c.tiktok)    ch.push('<a class="chip tt" target="_blank" rel="noopener" href="' + e(c.tiktok) + '">' + I.tt + '<span>' + u.tiktok + '</span></a>');
  if (c.website)   ch.push('<a class="chip web" target="_blank" rel="noopener" href="' + e(c.website) + '">' + I.globe + '<span>' + u.website + '</span></a>');
  if (c.email)     ch.push('<a class="chip mail" href="mailto:' + e(c.email) + '">' + I.mail + '<span>' + u.email + '</span></a>');
  ch.push('<button class="chip" id="share">' + I.share + '<span>' + u.share + '</span></button>');
  p.push('<div class="chips">' + ch.join("") + '</div>');

  /* 4 · menu with photos */
  if (c.menu && c.menu.length) p.push('<section class="sec">' +
    '<div class="sh"><h2>' + u.menu + '</h2><i></i></div>' +
    '<div class="panel" id="menu">' + c.menu.map(function(m){
      return '<a class="mr"' + (m.img ? ' href="' + e(m.img) + '"' : '') + '>' +
        (m.img ? '<img src="' + e(m.img) + '" alt="" loading="lazy">' : '') +
        '<span class="mb"><span class="mn">' + e(t(m.name)) + '</span>' +
        (m.desc ? '<span class="md">' + e(t(m.desc)) + '</span>' : '') + '</span>' +
        (m.price ? '<span class="mp' + nc(t(m.price)) + '">' + e(t(m.price)) + '</span>' : '') +
      '</a>';
    }).join("") + '</div></section>');

  /* 5 · wide gallery */
  if (c.gallery && c.gallery.length) p.push('<section class="sec">' +
    '<div class="sh"><h2>' + u.gallery + '</h2><i></i></div>' +
    '<div class="wide" id="wide">' + c.gallery.map(function(g){
      const src = (typeof g === "string") ? g : g.src;
      const cap = (typeof g === "string") ? "" : t(g.caption);
      return '<a class="wi" href="' + e(src) + '"><img src="' + e(src) + '" alt="" loading="lazy">' +
        (cap ? '<span>' + e(cap) + '</span>' : '') + '</a>';
    }).join("") + '</div></section>');

  /* 6 · hours */
  if (c.hours && c.hours.length) p.push('<section class="sec">' +
    '<div class="sh"><h2>' + u.hours + '</h2><i></i></div>' +
    '<div class="panel"><div class="hrsg">' + c.hours.map(function(h){
      return '<span class="d">' + e(t(h.days)) + '</span><span class="v' + nc(t(h.time)) + '">' + e(t(h.time)) + '</span>';
    }).join("") + '</div>' +
    (c.hoursNote ? '<p class="note">' + e(t(c.hoursNote)) + '</p>' : '') + '</div></section>');

  /* 7 · location */
  if (c.maps || c.address) {
    const inner = '<span class="ic">' + I.pin + '</span><span><span class="lt">' + u.directions + '</span>' +
      (c.address ? '<span class="lv">' + e(t(c.address)) + '</span>' : '') + '</span>';
    p.push('<section class="sec">' + (c.maps
      ? '<a class="panel loc" target="_blank" rel="noopener" href="' + e(c.maps) + '">' + inner + '</a>'
      : '<div class="panel loc">' + inner + '</div>') + '</section>');
  }

  /* 8 · review */
  if (c.review) p.push('<section class="rev">' +
    '<div class="stars">' + I.star + I.star + I.star + I.star + I.star + '</div>' +
    '<h3>' + u.review + '</h3><p>' + u.reviewSub + '</p>' +
    '<a class="b p" target="_blank" rel="noopener" href="' + e(c.review) + '">' + I.star + '<span>' + u.reviewBtn + '</span></a>' +
  '</section>');

  if (c.brand && c.brand.name) p.push('<p class="foot">' + u.by + ' <a href="' + e(c.brand.url || "#") + '" target="_blank" rel="noopener">' + e(c.brand.name) + '</a></p>');

  document.getElementById("app").innerHTML = p.join("");
  wire();
}

function wire(){
  Array.prototype.forEach.call(document.querySelectorAll(".lg"), function(b){
    b.addEventListener("click", function(){
      LANG = b.getAttribute("data-lang");
      try { localStorage.setItem("nfc4all-lang", LANG); } catch(err) {}
      render();
    });
  });

  const flip = document.getElementById("flip");
  const hint = document.getElementById("hint");
  function doFlip(){ if (flip) flip.classList.toggle("on"); }
  if (flip) {
    flip.addEventListener("click", function(ev){
      if (ev.target.closest("a")) return;
      doFlip();
    });
    flip.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); doFlip(); }
    });
  }
  if (hint) hint.addEventListener("click", doFlip);

  const sv = document.getElementById("save");
  if (sv) sv.addEventListener("click", saveContact);
  const sh = document.getElementById("share");
  if (sh) sh.addEventListener("click", shareCard);
  const sh2 = document.getElementById("share2");
  if (sh2) sh2.addEventListener("click", shareCard);

  ["menu", "wide"].forEach(function(id){
    const box = document.getElementById(id);
    if (!box) return;
    box.addEventListener("click", function(ev){
      const a = ev.target.closest("a");
      if (!a || !a.getAttribute("href")) return;
      ev.preventDefault();
      document.getElementById("lbi").src = a.getAttribute("href");
      document.getElementById("lb").hidden = false;
    });
  });
}

function closeLb(){ document.getElementById("lb").hidden = true; }
document.getElementById("lbx").addEventListener("click", closeLb);
document.getElementById("lb").addEventListener("click", function(ev){ if (ev.target.id === "lb") closeLb(); });
document.addEventListener("keydown", function(ev){ if (ev.key === "Escape") closeLb(); });

function vcardText(){
  const c = CARD, v = c.vcard || {}, L = [];
  L.push("BEGIN:VCARD", "VERSION:3.0");
  L.push("N:" + (v.lastName || "") + ";" + (v.firstName || "") + ";;;");
  L.push("FN:" + (v.fullName || t(c.name)));
  if (v.org)   L.push("ORG:" + v.org);
  if (v.title) L.push("TITLE:" + v.title);
  if (c.phone)    L.push("TEL;TYPE=CELL:" + c.phone);
  if (c.whatsapp && c.whatsapp !== c.phone) L.push("TEL;TYPE=WORK:" + c.whatsapp);
  if (c.email)   L.push("EMAIL;TYPE=INTERNET:" + c.email);
  if (c.website) L.push("URL:" + c.website);
  if (c.address) L.push("ADR;TYPE=WORK:;;" + t(c.address) + ";;;;");
  if (c.facebook)  L.push("X-SOCIALPROFILE;TYPE=facebook:" + c.facebook);
  if (c.instagram) L.push("X-SOCIALPROFILE;TYPE=instagram:" + c.instagram);
  if (c.tiktok)    L.push("X-SOCIALPROFILE;TYPE=tiktok:" + c.tiktok);
  L.push("NOTE:" + t(c.role));
  L.push("END:VCARD");
  return L.join("\r\n");
}

function saveContact(){
  try {
    const blob = new Blob([vcardText()], { type: "text/vcard;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ((CARD.vcard && CARD.vcard.fileName) || "contact") + ".vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast(UI[LANG].saved);
  } catch(err) { toast(UI[LANG].saved); }
}

function shareCard(){
  const data = { title: t(CARD.name), text: t(CARD.role), url: location.href };
  if (navigator.share) { navigator.share(data).catch(function(){}); return; }
  if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href).then(function(){ toast(UI[LANG].copied); }).catch(function(){});
  }
}

let toastTimer = null;
function toast(msg){
  const box = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  box.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ box.classList.remove("on"); }, 2400);
}

render();
</script>
</body>
</html>
